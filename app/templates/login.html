{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="step-card">
      <h1 class="h3 fw-bold mb-1">Log in</h1>
      <p class="text-muted">Welcome back.</p>

      <form method="post" action="{{ url_for('auth.login') }}" data-form="login" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
          <div class="invalid-feedback" id="email-error"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          <div class="invalid-feedback" id="password-error"></div>
        </div>
        <button class="btn btn-brand w-100" type="submit">Log in</button>
      </form>
      <p class="text-center mt-3 mb-0">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}<script src="{{ url_for('static', filename='js/validation.js') }}"></script>{% endblock %}
